<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 60" width="468" height="60" role="img" aria-labelledby="t d">
  <title id="t">The Sound Bulletin, hosted by Ron Bronson, on 90.3 KFFP Portland</title>
  <desc id="d">A banner ad in the style of a late 1990s web banner. Listen on Mixcloud.</desc>
  <style>
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .scan { animation: scan 2.4s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(-60px); } to { transform: translateX(468px); } }
    @media (prefers-reduced-motion: reduce) { .blink, .scan { animation: none; } }
    text { font-family: Verdana, Tahoma, "DejaVu Sans", Arial, sans-serif; }
    .imp { font-family: Impact, "Arial Black", "Archivo", Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a1a"/>
      <stop offset="1" stop-color="#a80000"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity=".18"/>
    </pattern>
    <clipPath id="box"><rect x="1" y="1" width="466" height="58"/></clipPath>
  </defs>

  <!-- banner body with a 1px black border, the way they always had one -->
  <rect x=".5" y=".5" width="467" height="59" fill="url(#bg)" stroke="#000" stroke-width="1"/>
  <rect x="1" y="1" width="466" height="58" fill="url(#dots)"/>

  <!-- light sweep -->
  <g clip-path="url(#box)">
    <rect class="scan" x="0" y="0" width="28" height="60" fill="#ffffff" opacity=".14" transform="skewX(-20)"/>
  </g>

  <!-- left: on-air lamp and frequency -->
  <g transform="translate(10 8)">
    <rect width="78" height="44" fill="#000"/>
    <circle class="blink" cx="12" cy="12" r="5" fill="#ff3b30"/>
    <text x="22" y="16" font-size="9" font-weight="700" fill="#ffffff" letter-spacing=".5">ON AIR</text>
    <text x="39" y="37" font-size="19" font-weight="700" fill="#f2c300" text-anchor="middle" class="imp">90.3</text>
  </g>

  <!-- middle: show name and host -->
  <text x="98" y="29" font-size="24" fill="#ffffff" class="imp" textLength="262" lengthAdjust="spacingAndGlyphs" stroke="#000" stroke-width="2.4" paint-order="stroke">THE SOUND BULLETIN</text>
  <text x="99" y="47" font-size="11" font-weight="700" fill="#ffffff" textLength="261" lengthAdjust="spacingAndGlyphs">with your host Ron Bronson &#183; KFFP Portland</text>

  <!-- right: bevelled button -->
  <g transform="translate(372 15)">
    <rect width="86" height="30" fill="url(#btn)"/>
    <path d="M0 30V0h86" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M86 0v30H0" fill="none" stroke="#7a4d00" stroke-width="2"/>
    <text x="43" y="19.5" font-size="11" font-weight="700" fill="#000" text-anchor="middle" textLength="72" lengthAdjust="spacingAndGlyphs">LISTEN NOW &#9656;</text>
  </g>
</svg>
