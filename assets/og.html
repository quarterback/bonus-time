<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ron Bronson, social card source</title>
<!--
  Source for assets/og.png (1200×630, the Open Graph / Twitter card).
  Not linked from anywhere; it exists so the card can be regenerated when the
  copy changes, instead of the image drifting out of date with the page.

  To regenerate, from the repo root:
    python3 -m http.server 8080 &
    node -e "const {chromium}=require('playwright');(async()=>{
      const b=await chromium.launch();
      const p=await b.newPage({viewport:{width:1200,height:630}});
      await p.goto('http://localhost:8080/assets/og.html',{waitUntil:'networkidle'});
      await p.screenshot({path:'assets/og.png'});await b.close();})()"

  Keep it 1200×630. That is 1.91:1, what summary_large_image crops to; the
  portrait alone is 4:5 and loses Ron's head at that ratio. No
  deviceScaleFactor — this command used to carry a 2, which writes a
  2400×1260 file while og:image:width/height in index.html still declare
  1200×630. Change one and you have to change the other.
-->
<!-- 2 November 2026: redrawn in the red tabloid style of the current front
     page: the name bar, the headline, the portrait. -->
<style>
  @font-face { font-family:"Archivo"; src:url("fonts/gallery/archivo-variable.woff2") format("woff2"); font-weight:100 900; font-stretch:62% 125%; }
  @font-face { font-family:"Source Serif 4"; src:url("fonts/gallery/source-serif-4-variable.woff2") format("woff2"); font-weight:200 900; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { display:grid; grid-template-columns:1fr 380px; background:#fff; color:#0b0b14; }
  .tx { display:flex; flex-direction:column; }
  .bar { background:#e10600; color:#fff; padding:22px 44px 12px; font-family:"Archivo",Arial,sans-serif; font-weight:900; font-stretch:62%; font-variation-settings:"wdth" 62; text-transform:uppercase; font-size:132px; line-height:.8; letter-spacing:-.01em; white-space:nowrap; }
  .rule { height:8px; background:#0b0b14; }
  .h { padding:34px 44px 0; font-family:"Archivo",Arial,sans-serif; font-weight:900; font-stretch:62%; font-variation-settings:"wdth" 62; text-transform:uppercase; font-size:62px; line-height:.88; letter-spacing:-.01em; }
  .h span { display:block; white-space:nowrap; }
  .h span:nth-child(2) { padding-left:8%; }
  .h span:nth-child(4) { padding-left:22%; color:#e10600; }
  .d { margin-top:auto; padding:0 44px 34px; font-family:"Source Serif 4",Georgia,serif; font-size:22px; line-height:1.35; max-width:720px; }
  img { width:380px; height:630px; object-fit:cover; object-position:50% 30%; display:block; }
</style>
</head>
<body>
  <div class="tx">
    <div class="bar">Ron Bronson</div>
    <div class="rule"></div>
    <p class="h"><span>Studies how technology</span><span>changes markets,</span><span>institutions, and</span><span>public life.</span></p>
    <p class="d">Assistant professor of practice in Urban Technology at the University of Michigan and founder of Vloora.</p>
  </div>
  <img src="profile.jpg" alt="" />
</body>
</html>
